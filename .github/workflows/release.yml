name: Release

# tag 规则：正式版 v<versionCode>（从 main 发），测试版 b<versionCode>（从 beta 发）
on:
  push:
    tags:
      - 'v*'
      - 'b*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 校验 tag 与 versionCode
        run: |
          TAG="${GITHUB_REF_NAME}"
          NUM="${TAG:1}"
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "tag=$TAG versionCode=$CODE versionName=$NAME"
          if [ "$NUM" != "$CODE" ]; then
            echo "::error::tag $TAG 的数字($NUM) 与 versionCode($CODE) 不一致"
            exit 1
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: 构建 release 包
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 整理产物（资产名固定为 Click.apk）
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Click.apk
          ls -l dist

      - name: 生成更新日志（上一个 tag 到本次 tag 的提交标题）
        run: |
          mkdir -p dist
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          echo "更新日志范围：$RANGE"
          git log --no-merges --pretty=format:'- %s' "$RANGE" > dist/notes.md
          printf '\n' >> dist/notes.md
          cat dist/notes.md

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Click.apk
          name: ${{ env.VERSION_NAME }}
          prerelease: ${{ startsWith(github.ref_name, 'b') }}
          body_path: dist/notes.md
          fail_on_unmatched_files: true
